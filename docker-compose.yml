version: '3.8'

services:
  # ── 1. ShopKart Web Application (Tomcat 11 + Java 21) ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopkart-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce_db}}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DRIVER=${DB_DRIVER:-org.postgresql.Driver}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY:-}
      - LOGISTICS_WEBHOOK_SECRET=${LOGISTICS_WEBHOOK_SECRET:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ── 2. PostgreSQL 16 Database Server ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopkart-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── 3. Redis In-Memory Cache & Session Store ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopkart-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ── 4. Jenkins CI/CD Automation Server (Optional) ─────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: shopkart-jenkins
    user: root
    ports:
      - "${JENKINS_PORT:-8085}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  jenkins_home:
