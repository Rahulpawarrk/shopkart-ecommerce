# ==============================================================================
# Microsoft SQL Server JDBC Database Configuration
# ==============================================================================
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.url=jdbc:sqlserver://localhost:14330;databaseName=ecommerce_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
db.user=sa
db.password=YourStrongPassword123!

# ==============================================================================
# HikariCP Connection Pool Settings
# ==============================================================================
hikaricp.poolName=EcommerceHikariPool
hikaricp.maximumPoolSize=20
hikaricp.minimumIdle=5
hikaricp.idleTimeout=300000
hikaricp.maxLifetime=1800000
hikaricp.connectionTimeout=30000
hikaricp.leakDetectionThreshold=60000
