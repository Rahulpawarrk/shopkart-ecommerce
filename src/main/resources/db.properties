# ==============================================================================
# Neon PostgreSQL / Database Configuration
# You can also supply these via environment variables: DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER
# ==============================================================================
db.driver=org.postgresql.Driver
# Example Neon JDBC URL format:
# db.url=jdbc:postgresql://<your-neon-endpoint>.neon.tech/ecommerce_db?sslmode=require
db.url=jdbc:postgresql://localhost:5432/ecommerce_db?sslmode=prefer
db.user=postgres
db.password=postgres

# ==============================================================================
# HikariCP Connection Pool Settings
# ==============================================================================
hikaricp.poolName=EcommerceHikariPool
hikaricp.maximumPoolSize=20
hikaricp.minimumIdle=5
hikaricp.idleTimeout=300000
hikaricp.maxLifetime=1800000
hikaricp.connectionTimeout=30000
hikaricp.leakDetectionThreshold=60000

