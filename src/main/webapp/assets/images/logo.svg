<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
    <defs>
        <!-- Background Icon Gradient -->
        <linearGradient id="skBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>

        <!-- Golden Amber Accent Gradient -->
        <linearGradient id="skGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="35%" stop-color="#fbbf24" />
            <stop offset="70%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- Text Gold Gradient -->
        <linearGradient id="skTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="40%" stop-color="#fbbf24" />
            <stop offset="85%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="skIconGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.5"/>
        </filter>
        <filter id="skBadgeShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- 1. ICON BADGE -->
    <g transform="translate(2, 4)">
        <!-- Outer Glowing Rounded Rect -->
        <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#skBadgeGrad)" filter="url(#skBadgeShadow)"/>
        <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.8"/>
        
        <!-- Speed Shopping Basket -->
        <path d="M9 13H14L16.5 25H29.5L32 16.5H15.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Basket Wheels -->
        <circle cx="18.5" cy="29.5" r="2" fill="url(#skGoldGrad)"/>
        <circle cx="27.5" cy="29.5" r="2" fill="url(#skGoldGrad)"/>
        
        <!-- High-Velocity Lightning Bolt Spark -->
        <path d="M24 9L20.5 16H25L22 22L28.5 14H24L26 9H24Z" fill="url(#skGoldGrad)" filter="url(#skIconGlow)"/>
    </g>

    <!-- 2. BRAND TYPOGRAPHY -->
    <!-- "Shop" in Crisp Modern Bold Sans -->
    <text x="50" y="27" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Shop</text>
    
    <!-- "Kart" in Energetic Vibrant Golden Amber Gradient -->
    <text x="108" y="27" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#skTextGrad)" letter-spacing="-0.5">Kart</text>

    <!-- 3. PLUS VIP BADGE -->
    <g transform="translate(162, 10)">
        <rect x="0" y="0" width="34" height="15" rx="3.5" fill="url(#skGoldGrad)"/>
        <text x="17" y="11" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="9.5" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">PLUS</text>
    </g>

    <!-- 4. SIGNATURE DYNAMIC SWOOSH (Amazon / Flipkart inspired smile curve with arrow) -->
    <path d="M52 35 C 80 41, 125 41, 154 33" stroke="url(#skGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M152 30.5 L 157.5 33.2 L 153.5 36.5" fill="url(#skGoldGrad)"/>

    <!-- 5. TAGLINE -->
    <text x="52" y="44" font-family="'Inter', sans-serif" font-weight="600" font-style="italic" font-size="7.5" fill="#94a3b8" letter-spacing="0.4">Explore <tspan fill="#fbbf24" font-weight="700">Plus ✦</tspan></text>
</svg>
