services:
  - type: web
    name: shopkart-ecommerce
    runtime: docker
    plan: free
    region: singapore # or frankfurt / oregon
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 1433
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
